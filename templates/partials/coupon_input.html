{% load custom_filters %}
<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-6">
    <h3 class="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
        <svg class="w-5 h-5 text-primary-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"/>
        </svg>
        Have a Coupon?
    </h3>
    
    <div id="coupon-section">
        <div id="coupon-input-area" class="flex gap-2">
            <input type="text" id="coupon-code" placeholder="Enter coupon code"
                   class="flex-1 px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all uppercase text-sm">
            <button onclick="applyCoupon()" id="apply-coupon-btn"
                    class="px-6 py-3 bg-primary-600 text-white font-medium rounded-xl hover:bg-primary-700 transition-colors">
                Apply
            </button>
        </div>
        
        <div id="coupon-applied" class="hidden">
            <div class="flex items-center justify-between p-4 bg-green-50 border border-green-200 rounded-xl">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-green-100 rounded-full flex items-center justify-center">
                        <svg class="w-5 h-5 text-green-600" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"/>
                        </svg>
                    </div>
                    <div>
                        <p class="font-semibold text-green-800" id="applied-coupon-code"></p>
                        <p class="text-sm text-green-600" id="applied-coupon-savings"></p>
                    </div>
                </div>
                <button onclick="removeCoupon()" class="text-red-600 hover:text-red-700 font-medium text-sm">
                    Remove
                </button>
            </div>
        </div>
        
        <div id="coupon-error" class="hidden mt-2 p-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm"></div>
    </div>
    
    <div class="mt-4 pt-4 border-t border-gray-100">
        <p class="text-xs text-gray-500">
            <svg class="w-4 h-4 inline mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            Try: <span class="font-mono cursor-pointer hover:text-primary-600" onclick="document.getElementById('coupon-code').value='WELCOME10';applyCoupon()">WELCOME10</span> for 10% off your first order!
        </p>
    </div>
</div>

<script>
function applyCoupon() {
    const code = document.getElementById('coupon-code').value.trim();
    if (!code) {
        showCouponError('Please enter a coupon code');
        return;
    }
    
    const btn = document.getElementById('apply-coupon-btn');
    btn.innerHTML = '<svg class="w-5 h-5 animate-spin inline" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>';
    btn.disabled = true;
    
    $.ajax({
        url: '/api/coupon/apply/',
        method: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({
            code: code,
            cart_total: window.cartTotal || 0
        }),
        success: function(response) {
            if (response.success) {
                document.getElementById('coupon-input-area').classList.add('hidden');
                document.getElementById('coupon-applied').classList.remove('hidden');
                document.getElementById('applied-coupon-code').textContent = response.coupon_code;
                document.getElementById('applied-coupon-savings').textContent = response.message;
                
                if (typeof window.updateCartTotals === 'function') {
                    window.updateCartTotals(response.discount);
                }
                
                if (typeof Cart !== 'undefined') {
                    Cart.showNotification(response.message, 'success');
                }
            }
        },
        error: function(xhr) {
            const response = xhr.responseJSON || {};
            showCouponError(response.error || 'Failed to apply coupon');
            btn.innerHTML = 'Apply';
            btn.disabled = false;
        }
    });
}

function removeCoupon() {
    $.ajax({
        url: '/api/coupon/remove/',
        method: 'POST',
        success: function() {
            document.getElementById('coupon-input-area').classList.remove('hidden');
            document.getElementById('coupon-applied').classList.add('hidden');
            document.getElementById('coupon-code').value = '';
            
            if (typeof window.updateCartTotals === 'function') {
                window.updateCartTotals(0);
            }
        }
    });
}

function showCouponError(message) {
    const errorDiv = document.getElementById('coupon-error');
    errorDiv.textContent = message;
    errorDiv.classList.remove('hidden');
    setTimeout(() => errorDiv.classList.add('hidden'), 3000);
}
</script>
