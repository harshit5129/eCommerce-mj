{% extends 'admin/base.html' %}
{% load custom_filters %}

{% block title %}{{ action }} Offer - Admin Panel{% endblock %}

{% block admin_content %}
<div class="mb-6">
    <nav class="flex items-center text-sm text-gray-500 mb-2">
        <a href="{% url 'admin_offers' %}" class="hover:text-primary-600">Offers</a>
        <svg class="w-4 h-4 mx-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        <span class="text-gray-700">{{ action }} Offer</span>
    </nav>
    <h1 class="text-2xl font-bold text-gray-800">{{ action }} Offer</h1>
</div>

<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 max-w-3xl">
    <form method="post">
        {% csrf_token %}
        
        <div class="space-y-6">
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Offer Name *</label>
                    <input type="text" name="name" required
                           value="{{ offer.name|default:'' }}"
                           placeholder="Summer Flash Sale"
                           class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Slug</label>
                    <input type="text" name="slug"
                           value="{{ offer.slug|default:'' }}"
                           placeholder="summer-flash-sale"
                           class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
                <textarea name="description" rows="2"
                          class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all resize-none">{{ offer.description|default:'' }}</textarea>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Offer Type</label>
                    <select name="offer_type" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all">
                        <option value="flash_sale" {% if offer.offer_type == 'flash_sale' %}selected{% endif %}>Flash Sale</option>
                        <option value="deal_of_day" {% if offer.offer_type == 'deal_of_day' %}selected{% endif %}>Deal of the Day</option>
                        <option value="weekend_special" {% if offer.offer_type == 'weekend_special' %}selected{% endif %}>Weekend Special</option>
                        <option value="clearance" {% if offer.offer_type == 'clearance' %}selected{% endif %}>Clearance</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Banner Text</label>
                    <input type="text" name="banner_text"
                           value="{{ offer.banner_text|default:'' }}"
                           placeholder="Limited Time Only!"
                           class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all">
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Discount Type</label>
                    <select name="discount_type" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all">
                        <option value="percentage" {% if offer.discount_type == 'percentage' %}selected{% endif %}>Percentage</option>
                        <option value="fixed" {% if offer.discount_type == 'fixed' %}selected{% endif %}>Fixed Amount</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Discount Value *</label>
                    <input type="number" name="discount_value" required step="0.01" min="0"
                           value="{{ offer.discount_value|default:'' }}"
                           placeholder="20"
                           class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all">
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Starts At</label>
                    <input type="datetime-local" name="starts_at"
                           value="{{ offer.starts_at|date:'Y-m-d\TH:i' }}"
                           class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Ends At *</label>
                    <input type="datetime-local" name="ends_at" required
                           value="{{ offer.ends_at|date:'Y-m-d\TH:i' }}"
                           class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Select Products</label>
                <div class="max-h-48 overflow-y-auto border border-gray-200 rounded-xl p-4 bg-gray-50">
                    {% for product in products %}
                    <label class="flex items-center gap-3 py-2 cursor-pointer hover:bg-white px-2 rounded">
                        <input type="checkbox" name="product_ids" value="{{ product.id }}"
                               {% if product.id in offer.product_ids %}checked{% endif %}
                               class="w-4 h-4 text-primary-600 rounded border-gray-300">
                        <span class="text-sm text-gray-800">{{ product.name }}</span>
                        <span class="text-xs text-gray-500">{{ product.price|rupee }}</span>
                    </label>
                    {% endfor %}
                </div>
            </div>
            
            <div class="space-y-3 pt-4 border-t border-gray-200">
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" name="is_active" {% if offer.is_active or not offer %}checked{% endif %}
                           class="w-5 h-5 text-primary-600 rounded border-gray-300 focus:ring-primary-500">
                    <span class="font-medium text-gray-800">Active</span>
                </label>
                
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" name="show_countdown" {% if offer.show_countdown or not offer %}checked{% endif %}
                           class="w-5 h-5 text-primary-600 rounded border-gray-300 focus:ring-primary-500">
                    <span class="font-medium text-gray-800">Show Countdown Timer</span>
                </label>
            </div>
        </div>
        
        <div class="flex items-center gap-4 mt-8">
            <button type="submit" class="px-6 py-3 bg-primary-600 text-white rounded-xl font-medium hover:bg-primary-700 transition-colors">
                {{ action }} Offer
            </button>
            <a href="{% url 'admin_offers' %}" class="px-6 py-3 text-gray-600 hover:text-gray-800 font-medium transition-colors">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
