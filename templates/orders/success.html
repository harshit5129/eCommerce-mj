{% extends 'base.html' %}

{% block title %}Order Success - E-Shop{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-16 px-4">
    <div class="max-w-md w-full text-center">
        <div class="relative mb-8">
            <div class="w-28 h-28 bg-green-100 rounded-full flex items-center justify-center mx-auto animate-bounce-in">
                <svg class="w-14 h-14 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                </svg>
            </div>
            <div class="absolute -bottom-2 left-1/2 -translate-x-1/2 flex gap-1">
                <div class="w-2 h-2 bg-green-400 rounded-full animate-ping"></div>
                <div class="w-2 h-2 bg-green-400 rounded-full animate-ping" style="animation-delay: 0.1s"></div>
                <div class="w-2 h-2 bg-green-400 rounded-full animate-ping" style="animation-delay: 0.2s"></div>
            </div>
        </div>
        
        <h1 class="text-3xl font-bold text-gray-800 mb-2">Thank You!</h1>
        <p class="text-gray-500 mb-8">Your order has been placed successfully.</p>
        
        <div class="bg-gradient-to-br from-gray-50 to-gray-100 rounded-2xl p-6 mb-8 border border-gray-200">
            <p class="text-sm text-gray-500 mb-1">Order Number</p>
            <p class="text-2xl font-bold text-primary-600 tracking-wider">{{ order.order_number }}</p>
        </div>
        
        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-8">
            <div class="flex items-center justify-center gap-2 text-gray-600 mb-2">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/></svg>
                <span class="text-sm">Confirmation email sent to</span>
            </div>
            <p class="font-semibold text-gray-800">{{ order.user_email }}</p>
        </div>
        
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="{% url 'order_history' %}" class="inline-flex items-center justify-center gap-2 px-6 py-3 btn-gradient text-white rounded-xl font-medium shadow-lg shadow-primary-500/30">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"/></svg>
                View Order Details
            </a>
            <a href="{% url 'product_list' %}" class="inline-flex items-center justify-center gap-2 px-6 py-3 border-2 border-gray-200 text-gray-700 rounded-xl font-medium hover:bg-gray-50 hover:border-gray-300 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
                Continue Shopping
            </a>
        </div>
    </div>
</div>
{% endblock %}
