<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 - Server Error | E-Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 500: '#dc2626', 600: '#b91c1c', 700: '#8b0000' },
                        secondary: { 400: '#fb923c', 500: '#f97316', 600: '#ea580c' },
                        accent: { 800: '#343a40', 900: '#212529' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-accent-900 min-h-screen flex items-center justify-center font-sans">
    <div class="text-center px-4">
        <div class="mb-8">
            <div class="inline-flex items-center justify-center w-32 h-32 bg-gradient-to-br from-primary-500 to-primary-700 rounded-full">
                <svg class="w-16 h-16 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                </svg>
            </div>
        </div>
        
        <h1 class="text-4xl md:text-5xl font-bold text-white mb-4">Server Error</h1>
        <p class="text-gray-400 text-lg mb-8 max-w-md mx-auto">
            We're sorry, something went wrong on our end. Our team has been notified and is working on it.
        </p>
        
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="{% url 'home' %}" class="inline-flex items-center justify-center gap-2 px-8 py-4 bg-white text-primary-700 font-bold rounded-xl hover:bg-gray-100 transition-all transform hover:scale-105 shadow-xl">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 17l-5-5m0 0l5-5m-5 5h12"/>
                </svg>
                Go Home
            </a>
            <button onclick="location.reload()" class="inline-flex items-center justify-center gap-2 px-8 py-4 bg-transparent border-2 border-secondary-400/50 text-secondary-400 font-bold rounded-xl hover:bg-secondary-400/20 hover:border-secondary-400 transition-all">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                </svg>
                Try Again
            </button>
        </div>
        
        <p class="text-gray-500 text-sm mt-12">
            If this problem persists, please <a href="{% url 'contact' %}" class="text-secondary-400 hover:text-secondary-300">contact us</a>.
        </p>
    </div>
</body>
</html>
