<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | E-Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: { 500: '#dc2626', 600: '#b91c1c', 700: '#8b0000' },
                        secondary: { 400: '#fb923c', 500: '#f97316', 600: '#ea580c' },
                        accent: { 800: '#343a40', 900: '#212529' }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-accent-900 min-h-screen flex items-center justify-center font-sans">
    <div class="text-center px-4">
        <div class="mb-8">
            <div class="inline-flex items-center justify-center w-32 h-32 bg-gradient-to-br from-secondary-500 to-primary-600 rounded-full animate-pulse">
                <span class="text-6xl font-bold text-white">404</span>
            </div>
        </div>
        
        <h1 class="text-4xl md:text-5xl font-bold text-white mb-4">Page Not Found</h1>
        <p class="text-gray-400 text-lg mb-8 max-w-md mx-auto">
            Oops! The page you're looking for doesn't exist or has been moved.
        </p>
        
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="{% url 'home' %}" class="inline-flex items-center justify-center gap-2 px-8 py-4 bg-white text-primary-700 font-bold rounded-xl hover:bg-gray-100 transition-all transform hover:scale-105 shadow-xl">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 17l-5-5m0 0l5-5m-5 5h12"/>
                </svg>
                Go Home
            </a>
            <a href="{% url 'product_list' %}" class="inline-flex items-center justify-center gap-2 px-8 py-4 bg-transparent border-2 border-secondary-400/50 text-secondary-400 font-bold rounded-xl hover:bg-secondary-400/20 hover:border-secondary-400 transition-all">
                Browse Products
            </a>
        </div>
        
        <p class="text-gray-500 text-sm mt-12">
            If you believe this is an error, please <a href="{% url 'contact' %}" class="text-secondary-400 hover:text-secondary-300">contact us</a>.
        </p>
    </div>
</body>
</html>
