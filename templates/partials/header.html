<header class="bg-white shadow-md sticky top-0 z-50">
    <div class="container mx-auto px-4">
        <div class="flex items-center justify-between py-4">
            <a href="{% url 'home' %}" class="text-2xl font-bold text-primary">
                E-Shop
            </a>
            
            <nav class="hidden md:flex space-x-8">
                <a href="{% url 'home' %}" class="text-gray-700 hover:text-primary transition">Home</a>
                <a href="{% url 'product_list' %}" class="text-gray-700 hover:text-primary transition">Products</a>
            </nav>
            
            <div class="flex items-center space-x-4">
                <form action="{% url 'product_list' %}" method="get" class="hidden lg:block">
                    <div class="relative">
                        <input type="text" name="search" placeholder="Search products..." 
                               class="w-64 px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent">
                        <button type="submit" class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-500 hover:text-primary">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                            </svg>
                        </button>
                    </div>
                </form>
                
                <a href="{% url 'cart' %}" class="relative p-2 text-gray-700 hover:text-primary transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/>
                    </svg>
                    <span id="cart-count-badge" class="absolute -top-1 -right-1 bg-primary text-white text-xs rounded-full h-5 w-5 flex items-center justify-center {% if cart_count == 0 %}hidden{% endif %}">
                        {{ cart_count }}
                    </span>
                </a>
                
                {% if request.session.user_id %}
                    <div class="relative group">
                        <button class="p-2 text-gray-700 hover:text-primary transition">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                        </button>
                        <div class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg py-2 hidden group-hover:block">
                            <a href="{% url 'profile' %}" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">Profile</a>
                            <a href="{% url 'order_history' %}" class="block px-4 py-2 text-gray-700 hover:bg-gray-100">My Orders</a>
                            <hr class="my-2">
                            <a href="{% url 'logout' %}" class="block px-4 py-2 text-red-600 hover:bg-gray-100">Logout</a>
                        </div>
                    </div>
                {% else %}
                    <a href="{% url 'login' %}" class="px-4 py-2 bg-primary text-white rounded-lg hover:bg-blue-600 transition">
                        Login
                    </a>
                {% endif %}
            </div>
        </div>
    </div>
</header>
