{% extends 'admin/base.html' %}
{% load custom_filters %}

{% block title %}{{ action }} Coupon - Admin Panel{% endblock %}

{% block admin_content %}
<div class="mb-6">
    <nav class="flex items-center text-sm text-gray-500 mb-2">
        <a href="{% url 'admin_coupons' %}" class="hover:text-primary-600">Coupons</a>
        <svg class="w-4 h-4 mx-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
        <span class="text-gray-700">{{ action }} Coupon</span>
    </nav>
    <h1 class="text-2xl font-bold text-gray-800">{{ action }} Coupon</h1>
</div>

<div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8 max-w-2xl">
    <form method="post">
        {% csrf_token %}
        
        <div class="space-y-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Coupon Code *</label>
                <input type="text" name="code" required
                       value="{{ coupon.code|default:'' }}"
                       placeholder="SUMMER2024"
                       class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all uppercase">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Description</label>
                <input type="text" name="description"
                       value="{{ coupon.description|default:'' }}"
                       placeholder="Summer sale discount"
                       class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all">
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Discount Type</label>
                    <select name="discount_type" class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all">
                        <option value="percentage" {% if coupon.discount_type == 'percentage' %}selected{% endif %}>Percentage</option>
                        <option value="fixed" {% if coupon.discount_type == 'fixed' %}selected{% endif %}>Fixed Amount</option>
                    </select>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Discount Value *</label>
                    <input type="number" name="discount_value" required step="0.01" min="0"
                           value="{{ coupon.discount_value|default:'' }}"
                           placeholder="10"
                           class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all">
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Minimum Order Value</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">₹</span>
                        <input type="number" name="min_order_value" step="0.01" min="0"
                               value="{{ coupon.min_order_value|default:'0' }}"
                               class="w-full pl-8 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all">
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Max Discount</label>
                    <div class="relative">
                        <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-500">₹</span>
                        <input type="number" name="max_discount" step="0.01" min="0"
                               value="{{ coupon.max_discount|default:'0' }}"
                               placeholder="0 = No limit"
                               class="w-full pl-8 pr-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all">
                    </div>
                </div>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Usage Limit (0 = Unlimited)</label>
                    <input type="number" name="usage_limit" min="0"
                           value="{{ coupon.usage_limit|default:'0' }}"
                           class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Per User Limit</label>
                    <input type="number" name="per_user_limit" min="1"
                           value="{{ coupon.per_user_limit|default:'1' }}"
                           class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Valid Until</label>
                <input type="datetime-local" name="valid_until"
                       value="{{ coupon.valid_until|date:'Y-m-d\TH:i' }}"
                       class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:bg-white focus:ring-2 focus:ring-primary-500 focus:border-transparent transition-all">
            </div>
            
            <div class="space-y-3 pt-4 border-t border-gray-200">
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" name="is_active" {% if coupon.is_active or not coupon %}checked{% endif %}
                           class="w-5 h-5 text-primary-600 rounded border-gray-300 focus:ring-primary-500">
                    <span class="font-medium text-gray-800">Active</span>
                </label>
                
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" name="is_first_order_only" {% if coupon.is_first_order_only %}checked{% endif %}
                           class="w-5 h-5 text-primary-600 rounded border-gray-300 focus:ring-primary-500">
                    <span class="font-medium text-gray-800">First Order Only</span>
                    <span class="text-sm text-gray-500">(Only for new customers)</span>
                </label>
            </div>
        </div>
        
        <div class="flex items-center gap-4 mt-8">
            <button type="submit" class="px-6 py-3 bg-primary-600 text-white rounded-xl font-medium hover:bg-primary-700 transition-colors">
                {{ action }} Coupon
            </button>
            <a href="{% url 'admin_coupons' %}" class="px-6 py-3 text-gray-600 hover:text-gray-800 font-medium transition-colors">
                Cancel
            </a>
        </div>
    </form>
</div>
{% endblock %}
