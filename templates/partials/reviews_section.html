{% load custom_filters %}
<div id="product-reviews" class="mt-12">
    <div class="flex items-center justify-between mb-8">
        <h2 class="text-2xl font-bold text-white">Customer Reviews</h2>
        <button onclick="openReviewModal()" class="px-4 py-2 btn-glow text-white rounded-xl font-medium transition-colors">
            Write a Review
        </button>
    </div>
    
    <div id="reviews-summary" class="bg-accent-800/50 rounded-2xl border border-accent-700/50 p-6 mb-8">
        <div class="flex flex-col md:flex-row gap-8">
            <div class="text-center md:border-r md:border-accent-700/50 md:pr-8">
                <div id="avg-rating" class="text-5xl font-bold text-white">0.0</div>
                <div id="avg-stars" class="flex justify-center gap-1 my-2"></div>
                <p id="total-reviews" class="text-gray-400">0 reviews</p>
            </div>
            <div class="flex-1">
                <div id="rating-bars" class="space-y-2">
                    <div class="flex items-center gap-3">
                        <span class="text-sm text-gray-400 w-8">5 ★</span>
                        <div class="flex-1 bg-accent-700/50 rounded-full h-2.5">
                            <div class="bg-gradient-to-r from-secondary-500 to-primary-500 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                        </div>
                        <span class="text-sm text-gray-500 w-8">0</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-sm text-gray-400 w-8">4 ★</span>
                        <div class="flex-1 bg-accent-700/50 rounded-full h-2.5">
                            <div class="bg-gradient-to-r from-secondary-500 to-primary-500 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                        </div>
                        <span class="text-sm text-gray-500 w-8">0</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-sm text-gray-400 w-8">3 ★</span>
                        <div class="flex-1 bg-accent-700/50 rounded-full h-2.5">
                            <div class="bg-gradient-to-r from-secondary-500 to-primary-500 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                        </div>
                        <span class="text-sm text-gray-500 w-8">0</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-sm text-gray-400 w-8">2 ★</span>
                        <div class="flex-1 bg-accent-700/50 rounded-full h-2.5">
                            <div class="bg-gradient-to-r from-secondary-500 to-primary-500 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                        </div>
                        <span class="text-sm text-gray-500 w-8">0</span>
                    </div>
                    <div class="flex items-center gap-3">
                        <span class="text-sm text-gray-400 w-8">1 ★</span>
                        <div class="flex-1 bg-accent-700/50 rounded-full h-2.5">
                            <div class="bg-gradient-to-r from-secondary-500 to-primary-500 h-2.5 rounded-full transition-all duration-500" style="width: 0%"></div>
                        </div>
                        <span class="text-sm text-gray-500 w-8">0</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <div id="reviews-list" class="space-y-6">
        <p class="text-center text-gray-500 py-8">Loading reviews...</p>
    </div>
</div>

<div id="review-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-accent-800 rounded-2xl shadow-2xl max-w-lg w-full max-h-[90vh] overflow-y-auto border border-accent-700/50">
        <div class="p-6 border-b border-accent-700/50">
            <div class="flex items-center justify-between">
                <h3 class="text-xl font-bold text-white">Write a Review</h3>
                <button onclick="closeReviewModal()" class="text-gray-400 hover:text-white">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
        </div>
        
        <form id="review-form" class="p-6 space-y-6" enctype="multipart/form-data">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Rating *</label>
                <div id="star-rating" class="flex gap-2">
                    <button type="button" onclick="setRating(1)" class="star-btn text-3xl text-gray-600 hover:text-secondary-400 transition-colors">★</button>
                    <button type="button" onclick="setRating(2)" class="star-btn text-3xl text-gray-600 hover:text-secondary-400 transition-colors">★</button>
                    <button type="button" onclick="setRating(3)" class="star-btn text-3xl text-gray-600 hover:text-secondary-400 transition-colors">★</button>
                    <button type="button" onclick="setRating(4)" class="star-btn text-3xl text-gray-600 hover:text-secondary-400 transition-colors">★</button>
                    <button type="button" onclick="setRating(5)" class="star-btn text-3xl text-gray-600 hover:text-secondary-400 transition-colors">★</button>
                </div>
                <input type="hidden" name="rating" id="rating-input" value="0">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Review Title</label>
                <input type="text" name="title" placeholder="Summarize your experience"
                       class="w-full px-4 py-3 bg-accent-700/50 border border-accent-600/50 text-gray-200 placeholder-gray-500 rounded-xl focus:ring-2 focus:ring-secondary-500 focus:border-transparent">
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Your Review *</label>
                <textarea name="review" rows="4" required
                          placeholder="Share your experience with this product..."
                          class="w-full px-4 py-3 bg-accent-700/50 border border-accent-600/50 text-gray-200 placeholder-gray-500 rounded-xl focus:ring-2 focus:ring-secondary-500 focus:border-transparent resize-none"></textarea>
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Pros</label>
                    <input type="text" name="pros" placeholder="Good quality, Fast delivery"
                           class="w-full px-4 py-3 bg-accent-700/50 border border-accent-600/50 text-gray-200 placeholder-gray-500 rounded-xl focus:ring-2 focus:ring-secondary-500 focus:border-transparent">
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-2">Cons</label>
                    <input type="text" name="cons" placeholder="Pricey, No warranty"
                           class="w-full px-4 py-3 bg-accent-700/50 border border-accent-600/50 text-gray-200 placeholder-gray-500 rounded-xl focus:ring-2 focus:ring-secondary-500 focus:border-transparent">
                </div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Photos (max 5, 5MB each)</label>
                <input type="file" name="images" multiple accept="image/*" id="review-images"
                       class="w-full px-4 py-3 bg-accent-700/50 border border-accent-600/50 text-gray-300 rounded-xl focus:ring-2 focus:ring-secondary-500 focus:border-transparent file:mr-4 file:py-1 file:px-4 file:rounded-lg file:border-0 file:bg-secondary-500/20 file:text-secondary-300 hover:file:bg-secondary-500/30">
                <div id="image-preview" class="flex flex-wrap gap-2 mt-2"></div>
            </div>
            
            <div>
                <label class="block text-sm font-medium text-gray-300 mb-2">Videos (max 2, 50MB each)</label>
                <input type="file" name="videos" multiple accept="video/*" id="review-videos"
                       class="w-full px-4 py-3 bg-accent-700/50 border border-accent-600/50 text-gray-300 rounded-xl focus:ring-2 focus:ring-secondary-500 focus:border-transparent file:mr-4 file:py-1 file:px-4 file:rounded-lg file:border-0 file:bg-secondary-500/20 file:text-secondary-300 hover:file:bg-secondary-500/30">
            </div>
            
            <button type="submit" class="w-full py-3 btn-glow text-white font-medium rounded-xl transition-colors">
                Submit Review
            </button>
        </form>
    </div>
</div>

<script>
const productId = '{{ product.id }}';
let currentRating = 0;

function getCSRFToken() {
    const cookieValue = document.cookie.match(/csrftoken=([^;]+)/);
    return cookieValue ? cookieValue[1] : '';
}

function loadReviews() {
    fetch('/api/offers/reviews/' + productId + '/')
        .then(response => response.json())
        .then(data => {
            if (data.error) {
                $('#reviews-list').html('<p class="text-center text-gray-500 py-8">Error loading reviews</p>');
                return;
            }
            
            if (data.total > 0) {
                $('#avg-rating').text(data.average_rating.toFixed(1));
                $('#total-reviews').text(data.total + ' review' + (data.total > 1 ? 's' : ''));
                
                let starsHtml = '';
                for (let i = 1; i <= 5; i++) {
                    if (i <= Math.round(data.average_rating)) {
                        starsHtml += '<svg class="w-5 h-5 text-yellow-400" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>';
                    } else {
                        starsHtml += '<svg class="w-5 h-5 text-gray-300" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>';
                    }
                }
                $('#avg-stars').html(starsHtml);
                
                const bars = $('#rating-bars > div');
                [5, 4, 3, 2, 1].forEach((rating, idx) => {
                    const count = data.rating_distribution[rating] || 0;
                    const pct = data.total > 0 ? (count / data.total * 100) : 0;
                    $(bars[idx]).find('div > div').css('width', pct + '%');
                    $(bars[idx]).find('span:last').text(count);
                });
            }
            
            if (data.reviews && data.reviews.length > 0) {
                let html = '';
                data.reviews.forEach(function(r) {
                    let mediaHtml = '';
                    if (r.images && r.images.length > 0) {
                        mediaHtml += '<div class="flex flex-wrap gap-2 mt-3">';
                        r.images.forEach(function(img) {
                            mediaHtml += `<img src="${img}" class="w-20 h-20 object-cover rounded-lg cursor-pointer hover:opacity-80" onclick="window.open('${img}', '_blank')">`;
                        });
                        mediaHtml += '</div>';
                    }
                    if (r.videos && r.videos.length > 0) {
                        mediaHtml += '<div class="flex flex-wrap gap-2 mt-2">';
                        r.videos.forEach(function(vid) {
                            mediaHtml += `<video src="${vid}" class="w-20 h-20 object-cover rounded-lg cursor-pointer" controls preload="metadata"></video>`;
                        });
                        mediaHtml += '</div>';
                    }
                    
                    html += `
                    <div class="bg-accent-800/50 rounded-2xl border border-accent-700/50 p-6 animate-fade-in">
                        <div class="flex items-start justify-between mb-4">
                            <div class="flex items-center gap-3">
                                <div class="w-10 h-10 bg-gradient-to-br from-secondary-500 to-primary-500 rounded-full flex items-center justify-center">
                                    <span class="text-white font-semibold">${r.user_name ? r.user_name.charAt(0).toUpperCase() : 'A'}</span>
                                </div>
                                <div>
                                    <p class="font-medium text-gray-200">${r.user_name || 'Anonymous'}</p>
                                    <p class="text-xs text-gray-500">${r.created_at || ''}</p>
                                </div>
                                ${r.is_verified ? '<span class="px-2 py-0.5 bg-secondary-500/20 text-secondary-300 text-xs rounded-full border border-secondary-500/30">Verified Purchase</span>' : ''}
                            </div>
                            <div class="flex gap-0.5">
                                ${Array(5).fill(0).map((_, i) => `<svg class="w-4 h-4 ${i < r.rating ? 'text-secondary-400' : 'text-gray-600'}" fill="currentColor" viewBox="0 0 20 20"><path d="M9.049 2.927c.3-.921 1.603-.921 1.902 0l1.07 3.292a1 1 0 00.95.69h3.462c.969 0 1.371 1.24.588 1.81l-2.8 2.034a1 1 0 00-.364 1.118l1.07 3.292c.3.921-.755 1.688-1.54 1.118l-2.8-2.034a1 1 0 00-1.175 0l-2.8 2.034c-.784.57-1.838-.197-1.539-1.118l1.07-3.292a1 1 0 00-.364-1.118L2.98 8.72c-.783-.57-.38-1.81.588-1.81h3.461a1 1 0 00.951-.69l1.07-3.292z"/></svg>`).join('')}
                            </div>
                        </div>
                        ${r.title ? `<h4 class="font-semibold text-gray-100 mb-2">${r.title}</h4>` : ''}
                        <p class="text-gray-300">${r.review}</p>
                        ${mediaHtml}
                        ${r.pros && r.pros.length > 0 ? `<div class="mt-3 flex flex-wrap gap-2">${r.pros.map(p => `<span class="px-2 py-1 bg-secondary-500/20 text-secondary-300 text-xs rounded-lg border border-secondary-500/30">+ ${p}</span>`).join('')}</div>` : ''}
                        ${r.cons && r.cons.length > 0 ? `<div class="mt-2 flex flex-wrap gap-2">${r.cons.map(c => `<span class="px-2 py-1 bg-primary-500/20 text-primary-300 text-xs rounded-lg border border-primary-500/30">- ${c}</span>`).join('')}</div>` : ''}
                        <div class="mt-4 pt-4 border-t border-accent-700/50 flex items-center gap-4">
                            <button onclick="markHelpful('${r.id}')" class="text-sm text-gray-500 hover:text-secondary-400 flex items-center gap-1 transition-colors">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 10h4.764a2 2 0 011.789 2.894l-3.5 7A2 2 0 0115.263 21h-4.017c-.163 0-.326-.02-.485-.06L7 20m7-10V5a2 2 0 00-2-2h-.095c-.5 0-.905.405-.905.905 0 .714-.211 1.412-.608 2.006L7 11v9m7-10h-2M7 20H5a2 2 0 01-2-2v-6a2 2 0 012-2h2.5"/></svg>
                                Helpful (${r.helpful_count})
                            </button>
                        </div>
                    </div>`;
                });
                $('#reviews-list').html(html);
            } else {
                $('#reviews-list').html('<p class="text-center text-gray-500 py-8">No reviews yet. Be the first to review!</p>');
            }
        })
        .catch(error => {
            console.error('Error loading reviews:', error);
            $('#reviews-list').html('<p class="text-center text-primary-400 py-8">Error loading reviews. Please refresh the page.</p>');
        });
}

function setRating(rating) {
    currentRating = rating;
    $('#rating-input').val(rating);
    $('.star-btn').each(function(i) {
        $(this).toggleClass('text-secondary-400', i < rating).toggleClass('text-gray-600', i >= rating);
    });
}

function openReviewModal() {
    {% if not request.user.is_authenticated %}
        alert('Please login to write a review');
        window.location.href = '/accounts/login/?next=' + window.location.pathname;
        return;
    {% endif %}
    $('#review-modal').removeClass('hidden');
}

function closeReviewModal() {
    $('#review-modal').addClass('hidden');
}

function markHelpful(reviewId) {
    {% if not request.user.is_authenticated %}
        alert('Please login to mark reviews as helpful');
        return;
    {% endif %}
    
    fetch('/api/offers/review/helpful/', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': getCSRFToken()
        },
        body: JSON.stringify({ review_id: reviewId })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            loadReviews();
        } else if (data.error) {
            alert(data.error);
        }
    })
    .catch(error => {
        console.error('Error:', error);
    });
}

$('#review-form').on('submit', function(e) {
    e.preventDefault();
    
    if (currentRating === 0) {
        alert('Please select a rating');
        return;
    }
    
    const formData = new FormData(this);
    formData.set('product_id', productId);
    formData.set('rating', currentRating);
    formData.set('title', $('input[name="title"]').val());
    formData.set('review', $('textarea[name="review"]').val());
    
    const prosVal = $('input[name="pros"]').val();
    if (prosVal) {
        prosVal.split(',').forEach(p => {
            if (p.trim()) formData.append('pros', p.trim());
        });
    }
    
    const consVal = $('input[name="cons"]').val();
    if (consVal) {
        consVal.split(',').forEach(c => {
            if (c.trim()) formData.append('cons', c.trim());
        });
    }
    
    const submitBtn = $(this).find('button[type="submit"]');
    const originalText = submitBtn.text();
    submitBtn.prop('disabled', true).text('Submitting...');
    
    fetch('/api/offers/review/submit/', {
        method: 'POST',
        headers: {
            'X-CSRFToken': getCSRFToken()
        },
        body: formData
    })
    .then(response => response.json())
    .then(data => {
        submitBtn.prop('disabled', false).text(originalText);
        if (data.success) {
            alert(data.message + (data.is_verified ? ' (Verified Purchase)' : ''));
            closeReviewModal();
            loadReviews();
            $('#review-form')[0].reset();
            setRating(0);
            $('#image-preview').empty();
        } else if (data.error) {
            alert(data.error);
        }
    })
    .catch(error => {
        submitBtn.prop('disabled', false).text(originalText);
        console.error('Error:', error);
        alert('Failed to submit review. Please try again.');
    });
});

$('#review-images').on('change', function(e) {
    const preview = $('#image-preview');
    preview.empty();
    const files = Array.from(e.target.files).slice(0, 5);
    files.forEach(file => {
        if (file.type.startsWith('image/')) {
            const reader = new FileReader();
            reader.onload = function(e) {
                preview.append(`<img src="${e.target.result}" class="w-16 h-16 object-cover rounded-lg border">`);
            };
            reader.readAsDataURL(file);
        }
    });
});

$(document).ready(function() {
    loadReviews();
});
</script>
