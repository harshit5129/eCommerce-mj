{% extends 'base.html' %}

{% block title %}Password Reset Complete - E-Shop{% endblock %}

{% block content %}
<div class="min-h-[85vh] flex items-center justify-center py-12 px-4">
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <a href="{% url 'home' %}" class="text-3xl font-bold gradient-text">E-Shop</a>
        </div>
        
        <div class="bg-white rounded-2xl shadow-xl p-8 border border-gray-100 text-center">
            <div class="w-16 h-16 bg-green-100 rounded-full flex items-center justify-center mx-auto mb-6">
                <svg class="w-8 h-8 text-green-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
                </svg>
            </div>
            
            <h2 class="text-2xl font-bold text-gray-800 mb-3">Password Reset Successful!</h2>
            <p class="text-gray-500 mb-6">
                Your password has been successfully reset. You can now sign in with your new password.
            </p>
            
            <a href="{% url 'login' %}" class="inline-flex items-center gap-2 px-6 py-3 bg-primary-600 text-white rounded-xl font-medium hover:bg-primary-700 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"/>
                </svg>
                Sign In Now
            </a>
        </div>
    </div>
</div>
{% endblock %}
